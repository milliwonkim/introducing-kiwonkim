<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="apple-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="highlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="180" height="180" rx="40" fill="url(#apple-gradient)"/>
  
  <!-- Highlight overlay -->
  <rect width="180" height="180" rx="40" fill="url(#highlight)"/>
  
  <!-- K letter scaled for larger size -->
  <g transform="translate(90, 90)">
    <!-- Main vertical line -->
    <rect x="-20" y="-45" width="12" height="90" fill="white" rx="6"/>
    
    <!-- Upper diagonal -->
    <path d="M -8 -22 L 25 -45 L 35 -35 L 2 -12 Z" fill="white"/>
    
    <!-- Lower diagonal -->
    <path d="M -8 22 L 25 45 L 35 35 L 2 12 Z" fill="white"/>
    
    <!-- Decorative accent -->
    <circle cx="25" cy="-35" r="6" fill="rgba(255,255,255,0.8)"/>
    <circle cx="25" cy="35" r="4" fill="rgba(255,255,255,0.6)"/>
  </g>
</svg>
