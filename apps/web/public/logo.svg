<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="primary-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="highlight-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="32" cy="32" r="28" fill="url(#primary-gradient)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- K letter with modern design -->
  <g transform="translate(32, 32)">
    <!-- Main vertical line of K -->
    <rect x="-8" y="-16" width="4" height="32" fill="white" rx="2"/>
    
    <!-- Upper diagonal of K -->
    <path d="M -4 -8 L 8 -16 L 12 -12 L 0 -4 Z" fill="white"/>
    
    <!-- Lower diagonal of K -->
    <path d="M -4 8 L 8 16 L 12 12 L 0 4 Z" fill="white"/>
    
    <!-- Accent dot -->
    <circle cx="8" cy="-12" r="2" fill="url(#highlight-gradient)"/>
  </g>
  
  <!-- Subtle shadow effect -->
  <circle cx="32" cy="34" r="26" fill="rgba(0,0,0,0.1)" opacity="0.3"/>
</svg>
